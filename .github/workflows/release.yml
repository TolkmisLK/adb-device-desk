name: Publish Windows preview
on:
  push:
    tags: ['v*-preview.*']

permissions:
  contents: read

jobs:
  validate-build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Verify preview tag and version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -cnotmatch '^v(?<version>\d+\.\d+\.\d+)-preview\.[1-9]\d*$') { throw 'Unsupported preview tag' }
          $version = $Matches.version
          $pubspecVersion = (Select-String -Path pubspec.yaml -Pattern '^version: (\S+)').Matches[0].Groups[1].Value.Split('+')[0]
          if ($version -ne $pubspecVersion) { throw 'Tag version must match pubspec.yaml' }
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze --fatal-infos
      - run: dart tool/core_smoke.dart
      - run: ./tool/test-publish-preview-plan.ps1
        shell: pwsh
      - run: flutter test
      - name: Build, package and check extracted startup
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -cnotmatch '^v(?<version>\d+\.\d+\.\d+)-preview\.[1-9]\d*$') { throw 'Unsupported preview tag' }
          ./tool/build-windows.ps1 -Version $Matches.version
      - uses: actions/upload-artifact@v4
        with:
          name: public-preview-bundle
          path: dist/*
          if-no-files-found: error

  publish:
    needs: validate-build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: public-preview-bundle
          path: dist
      - name: Publish exact-commit prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: ./tool/publish-preview.ps1 -Tag $env:RELEASE_TAG -Commit $env:RELEASE_COMMIT
