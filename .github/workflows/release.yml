name: Prepare release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - name: Build and package
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./tool/build-windows.ps1 -Version $env:RELEASE_TAG.TrimStart('v')
      - name: Create draft release with checksums
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $files = (Get-ChildItem dist/* -File).FullName
          gh release create $env:RELEASE_TAG @files --verify-tag --draft --title "ADB Device Desk $env:RELEASE_TAG" --notes-file docs/RELEASE-NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed' }
